[package]
name = "nyb-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "macros"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qubit = "0.10"
ts-rs = "10"
frozen-duckdb = "0.1.0"
